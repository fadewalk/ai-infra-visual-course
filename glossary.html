    {n:'Chunking 切块',e:'Chunking',c:'infer',d:'RAG 里把长文档切成适合检索的小段；粒度直接决定检索质量。',a:'日志切分粒度：太粗查不准，太细丢上下文。',l:'07_rag_and_tools/01_rag_basics.html|第 8 课'},
    {n:'向量数据库',e:'Vector Database',c:'infer',d:'存 Embedding 并支持按"意思相似度"检索的数据库（Milvus / FAISS / pgvector…）。',a:'ES 按关键词建索引，它按语义。',l:'07_rag_and_tools/01_rag_basics.html|第 8 课'},
    {n:'Rerank 重排',e:'Reranker',c:'infer',d:'初检之后用更精细的模型对候选重新排序，提升相关性。',a:'粗筛之后加一道精查。',l:'07_rag_and_tools/01_rag_basics.html|第 8 课'},
    /* ---------- 调度与运维 ---------- */
    {n:'Device Plugin',e:'设备插件',c:'ops',d:'节点上的 DaemonSet，把 GPU 数量上报为 K8s 扩展资源，并在分配时上报设备 ID。',a:'思路同 CSI：kubelet 通过 gRPC 找"管家"要资源。',l:'04_cloud_native_ai_platform/01_k8s_gpu.html|第 4 课'},
    {n:'nvidia.com/gpu',e:'扩展资源名',c:'ops',d:'K8s 里 GPU 的资源名，写进 Pod 的 resources.limits。',a:'不是 CPU/内存那种可压缩资源——要么给要么不给。',l:'04_cloud_native_ai_platform/01_k8s_gpu.html|第 4 课'},
    {n:'NVIDIA Container Toolkit',e:'容器工具包',c:'ops',d:'创建容器时把宿主机驱动库和 /dev/nvidia* 注入容器的运行时钩子。',a:'容器里没内核：驱动在宿主，库给你挂进去。',l:'04_cloud_native_ai_platform/01_k8s_gpu.html|第 4 课'},
    {n:'GPU Operator',e:'GPU 管理器',c:'ops',d:'用 Operator 把驱动/Container Toolkit/Device Plugin/DCGM 全套自动化部署到集群。',a:'GPU 版的"集群初始化剧本"。',l:'04_cloud_native_ai_platform/01_k8s_gpu.html|第 4 课'},
    {n:'Gang Scheduling',e:'成组调度',c:'ops',d:'8 卡训练作业要么 8 张卡全到位、要么全部等待——防止先启动的卡干等烧钱。',a:'包车：人不齐不发车。',l:'04_cloud_native_ai_platform/01_k8s_gpu.html|第 4 课'},
    {n:'Volcano / Kueue',e:'批调度器 / 作业队列',c:'ops',d:'K8s 上提供 Gang 调度、队列、配额的两个主流方案。',a:'Slurm 思路在 K8s 上的重生。',l:'04_cloud_native_ai_platform/01_k8s_gpu.html|第 4 课'},
    {n:'HAMi',e:'Heterogeneous AI Computing Virtualization',c:'ops',d:'开源 GPU 池化项目：显存配额、算力切分、vGPU 调度——补上 K8s 对 GPU 没有硬隔离的课。',a:'给 GPU 补一套 cgroup。'},
    {n:'vGPU',e:'虚拟 GPU',c:'ops',d:'GPU 切分共享方案的统称（硬件 MIG / 驱动 MPS / 软件时间片 / 池化 HAMi）。',a:'计算资源的"虚拟化"三境界。',l:'04_cloud_native_ai_platform/01_k8s_gpu.html|第 4 课'},
    {n:'时间切片',e:'Time-Slicing',c:'ops',d:'多个 Pod 轮流占用整张卡，秒级切换；都会跑但互相拖慢。',a:'单核 CPU 的时间片轮转。',l:'04_cloud_native_ai_platform/01_k8s_gpu.html|第 4 课'},
    {n:'DCGM',e:'Data Center GPU Manager',c:'ops',d:'NVIDIA 官方的数据中心 GPU 监控/诊断框架，集群监控的事实标准。',a:'GPU 的 node-exporter。',l:'03_ai_cluster_ops/01_gpu_ops.html|加餐速查'},
    {n:'DCGM-Exporter',e:'监控导出器',c:'ops',d:'把 DCGM 指标暴露成 Prometheus 格式。',a:'名字已经说明一切。',l:'03_ai_cluster_ops/01_gpu_ops.html|加餐速查'},
    {n:'XID',e:'NVIDIA 错误码',c:'ops',d:'GPU 驱动写入内核日志的错误编号（dmesg | grep -i xid）；79=掉总线、13=非法访存…',a:'GPU 世界的 Oops 码，排障第一线索。',l:'03_ai_cluster_ops/02_gpu_troubleshoot_sim.html|排障模拟器'},
    {n:'ECC 错误',e:'Error Correcting Code',c:'ops',d:'显存纠错机制；不可修复 ECC 错误 = 硬件损伤信号，摘节点报修。',a:'内存 ECC 的 GPU 版，坏页会被替换（Remapped Rows）。'},
    {n:'GPU-Util 误区',e:'Utilization Myth',c:'ops',d:'nvidia-smi 的 GPU-Util 只说明"有 kernel 在跑"，不代表算力用满；看真相要 SM Active。',a:'进程存在 ≠ CPU 在干活。',l:'03_ai_cluster_ops/02_gpu_troubleshoot_sim.html|排障模拟器'},
    {n:'拓扑感知调度',e:'Topology-Aware Scheduling',c:'ops',d:'按 NVLink/PCIe 亲和度安排 Pod 位置，让通信密集的作业落在同一高速域。',a:'把常互访的服务调度到同可用区。'},
    {n:'PD 分离',e:'Prefill/Decode Disaggregation',c:'ops',d:'把 Prefill 和 Decode 部署到不同机器，各司其职；代价是跨机传 KV Cache。',a:'读写分离：写入密集和查询密集各用一套。',l:'09_inference_system/01_inference_pipeline.html|第 3 课'}
  ];
  var cards=document.getElementById('cards'),count=document.getElementById('count'),empty=document.getElementById('empty');
  var curCat='all',q='';
  function linkHtml(l){
    if(!l)return '';
    var p=l.split('|');
    var href=(p[0].indexOf('http')===0)?p[0]:p[0];
    return '<p class="lk">→ <a href="'+href+'">'+(p[1]||p[0])+'</a></p>';
  }
  function render(){
    cards.innerHTML='';
    var total=0;
    for(var ck in CATS){
      if(curCat!=='all'&&curCat!==ck)continue;
      var items=T.filter(function(t){
        if(t.c!==ck)return false;
        if(!q)return true;
        return (t.n+t.e+t.d+t.a).toLowerCase().indexOf(q)>=0;
      });
      if(!items.length)continue;
      total+=items.length;
      var sec=document.createElement('div');
      var h=document.createElement('div');h.className='cat-h';h.style.setProperty('--bc',CATS[ck].c);
      h.innerHTML=CATS[ck].n+' <small>'+items.length+' 条</small>';
      sec.appendChild(h);
      var grid=document.createElement('div');grid.className='cards';
      items.forEach(function(t){
        var d=document.createElement('details');
        d.innerHTML='<summary><span>'+t.n+'</span><span class="en">'+t.e+'</span></summary>'
          +'<div class="body"><p class="one">'+t.d+'</p><p class="ana">🧠 '+t.a+'</p>'+linkHtml(t.l)+'</div>';
        grid.appendChild(d);
      });
      sec.appendChild(grid);
      cards.appendChild(sec);
    }
    count.textContent='共 '+total+' 条';
    empty.hidden=total>0;
  }
  document.querySelectorAll('.pill').forEach(function(p){
    p.addEventListener('click',function(){
      document.querySelectorAll('.pill').forEach(function(x){x.classList.remove('on');});
      p.classList.add('on');
      curCat=p.dataset.c;
      render();
    });
  });
  document.getElementById('q').addEventListener('input',function(){
    q=this.value.trim().toLowerCase();
    render();
  });
  /* ---------- 思维导图 ---------- */
  var mm=document.getElementById('mindmap');
  var NS='http://www.w3.org/2000/svg';
  var cx=450,cy=150;
  function node(x,y,r,fill,label,click,fs){
    var g=document.createElementNS(NS,'g');
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r);
    c.setAttribute('fill',fill);c.setAttribute('fill-opacity','.18');c.setAttribute('stroke',fill);
    g.appendChild(c);
    var t=document.createElementNS(NS,'text');
    t.setAttribute('x',x);t.setAttribute('y',y+4);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size',fs||12);t.setAttribute('fill','var(--fg)');
    t.textContent=label;g.appendChild(t);
    if(click){g.style.cursor='pointer';g.addEventListener('click',click);}
    mm.appendChild(g);
    return g;
  }
  function edge(x1,y1,x2,y2,color){
    var l=document.createElementNS(NS,'line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke',color);l.setAttribute('stroke-opacity','.5');l.setAttribute('stroke-width','1.5');
    mm.appendChild(l);
  }
  var branches=[
    {c:'hw',x:120,y:55,leaves:['SM · Warp','Tensor Core','HBM · NVLink','GPUDirect']},
    {c:'prog',x:120,y:245,leaves:['CUDA · Kernel','Stream','Nsight']},
    {c:'train',x:760,y:55,leaves:['梯度 · 损失','DDP · AllReduce','LoRA · SFT']},
    {c:'infer',x:760,y:245,leaves:['Prefill · Decode','KV Cache','TTFT · TPOT']},
    {c:'ops',x:450,y:262,leaves:['Device Plugin','Gang Scheduling','XID · DCGM','HAMi · vGPU']}
  ];
  node(cx,cy,34,'var(--orange)','AI Infra',null,13);
  branches.forEach(function(b){
    edge(cx,cy,b.x,b.y,CATS[b.c].c);
    var el=node(b.x,b.y,26,CATS[b.c].c,CATS[b.c].n,function(){
      document.querySelectorAll('.pill').forEach(function(x){x.classList.toggle('on',x.dataset.c===b.c);});
      curCat=b.c;render();
      window.scrollTo({top:document.getElementById('cards').offsetTop-60,behavior:'smooth'});
    },12);
    b.leaves.forEach(function(leaf,i){
      var lx=b.x+(cx-b.x)*0.42+(i-(b.leaves.length-1)/2)*86*(b.x<cx?-1:1)*-1;
      var ly=b.y+(b.y<cy?38:-38);
      edge(b.x,b.y,lx,ly,CATS[b.c].c);
      var t=document.createElementNS(NS,'text');
      t.setAttribute('x',lx);t.setAttribute('y',ly+4);t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','10.5');t.setAttribute('fill','var(--muted)');
      t.textContent=leaf;
      mm.appendChild(t);
    });
  });
  render();
})();
</script>
</body>
</html>
