      {t:'KV Cache 是什么？为什么它决定并发上限？',d:1,a:['缓存历史 token 的 K/V 中间结果，避免每步重算——拿显存换计算','占用随上下文线性涨：并发 ≈ (总显存−权重−预留)÷(每 token KV×会话长度)','PagedAttention=OS 分页思想治碎片，浪费从 60-80% 降到近零'],ref:'KV 计算器 · '+S+'09_inference_system/03_kv_capacity_calc.html'},

    {t:'系统设计 ①：为 2000 人内部团队部署代码助手（类 Copilot）',cond:'约束：代码库私有化、峰值 500 并发、P90 TTFT < 1.5s、预算有限。',a:['负载画像：Agent 式多轮+长系统提示词→前缀缓存命中率是第一杠杆','架构：网关→(前缀感知路由)→vLLM/SGLang 池（小参数量+FP8+投机解码，代码任务接受率高）→KV 分层','容量：KV 计算器按"会话×代码上下文长度"推显存→定并发与卡数','SRE：按 TTFT/TPOT 分池扩容、灰度模型版本、代码基准回归'],ref:'综合：第 3/6 课 + PD 分离 + 投机解码 + KV 计算器'},
    {t:'系统设计 ②：训练集群的 8×H100 作业频繁失败，怎么治理？',cond:'现象：平均每天 2-3 次失败重跑，每次损失数小时。',a:['先建账：失败分类（硬件 XID/网络 IB/存储 IO/代码 OOM）→帕累托','硬件：DCGM 自动巡检+坏卡自动 cordon；checkpoint 频率对齐 MTBF','调度：Gang+队列优先级保护大作业；弹性队列填谷','演练：定期故障注入验证恢复流程'],ref:'综合：排障模拟器 + Gang 演示 + 70B 复盘'},
    {t:'系统设计 ③：把 API 成本降 50%（不换模型）',cond:'现状：月账单 $80K，TTFT/质量不能劣化超过 10%。',a:['第一步永远是拆账：输入 token×单价 + 输出 token×单价 + 缓存命中的折扣结构','杠杆排序：前缀缓存（系统提示词+多轮共享）> 批处理利用率 > 量化降档 > 投机解码 > 错峰','每上一招灰度验证质量回归，量化必须业务 case 兜底'],ref:'综合：$/token 速算 + 投机解码加餐 + 工程概念页'}
  ];
  var bank=document.getElementById('bank');
  var done={},doneN=document.getElementById('doneN');
  function countDone(){var n=0;for(var k in done)if(done[k])n++;doneN.textContent=n;}
  function esc(s){return s;}
  function render(filter){
    bank.innerHTML='';
    var idx=0;
    QS.forEach(function(cat){
      if(filter!=='all'&&filter!==cat.c)return;
      var h=document.createElement('div');h.className='cat-h';h.style.setProperty('--cc',cat.cc);
      h.innerHTML=cat.cat+' <small>'+cat.q.length+' 题</small>';
      bank.appendChild(h);
      cat.q.forEach(function(q){
        idx++;
        renderQ(idx,q,cat.cc);
      });
    });
    if(filter==='all'||filter==='sys'){
      var h2=document.createElement('div');h2.className='cat-h';h2.style.setProperty('--cc','var(--red)');
      h2.innerHTML='系统设计 <small>3 题 · 高级岗必考</small>';
      bank.appendChild(h2);
      SYS.forEach(function(q){idx++;renderQ(idx,q,'var(--red)');});
    }
    countDone();
  }
  function renderQ(i,q,cc){
    var d=document.createElement('details');d.style.setProperty('--cc',cc);
    var dif=q.d===1?'<span class="dif d1">基础</span>':(q.d===2?'<span class="dif d2">进阶</span>':'<span class="dif d3">高频深挖</span>');
    var items=q.a.map(function(x){return '<li>'+x+'</li>';}).join('');
    d.innerHTML='<summary><span class="qt"><span style="color:var(--muted);font-size:12px">'+String(i).padStart(2,'0')+'</span>'+dif+'<span>'+q.t+'</span></span><span class="done-flag" id="f'+i+'">'+(done[i]?'✓':'')+'</span></summary>'
      +'<div class="body"><div class="ans-label">答题要点（先自己口述再对照）：</div><ul>'+items+'</ul>'
      +'<div class="ref">📚 复习：'+q.ref+'</div>'
      +'<div class="mark"><button id="m'+i+'" class="'+(done[i]?'done':'')+'" type="button">'+(done[i]?'已掌握 ✓':'标记为已掌握')+'</button></div></div>';
    bank.appendChild(d);
    setTimeout(function(){
      document.getElementById('m'+i).addEventListener('click',function(e){
        e.preventDefault();
        done[i]=!done[i];
        this.className=done[i]?'done':'';
        this.textContent=done[i]?'已掌握 ✓':'标记为已掌握';
        document.getElementById('f'+i).textContent=done[i]?'✓':'';
        countDone();
      });
    },0);
  }
  document.querySelectorAll('.pill').forEach(function(p){
    p.addEventListener('click',function(){
      document.querySelectorAll('.pill').forEach(function(x){x.classList.remove('on');});
      p.classList.add('on');
      render(p.dataset.c);
    });
  });
  render('all');
})();
</script>
</body>
</html>
